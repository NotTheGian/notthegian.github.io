<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Fusa·Heatmap Colaborativo (OSM)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #1a2a2a; height: 100vh; display: flex; flex-direction: column; }
        .header { background: #0f2b2a; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .header h1 { font-size: 1.2rem; }
        .stats { background: #2c4e4b; padding: 4px 12px; border-radius: 40px; font-size: 0.75rem; }
        #map { flex: 1; width: 100%; background: #cbd5e1; }
        .footer { background: #0f2b2a; color: #9bb5b0; padding: 6px 12px; font-size: 0.65rem; text-align: center; }
        .control { padding: 8px 12px; background: #f5f7fb; display: flex; gap: 12px; align-items: center; justify-content: space-between; border-top: 1px solid #ddd; }
        button { background: #1e6f5c; border: none; padding: 6px 14px; border-radius: 40px; color: white; cursor: pointer; }
        .leyenda { display: flex; align-items: center; gap: 8px; font-size: 0.7rem; }
        .gradient { width: 80px; height: 6px; background: linear-gradient(to right, blue, cyan, yellow, red); border-radius: 6px; }
        #roomStatus { font-size: 0.7rem; background: #2c4e4b; padding: 2px 8px; border-radius: 20px; }
        .debug { font-size: 0.65rem; padding: 4px 12px; background: #eef2f5; border-top: 1px solid #ddd; color: #1a2a2a; text-align: center; }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
<div class="header">
    <h1>📍 Fusa·Calor Colaborativo</h1>
    <div class="stats" id="contadorDispositivos">0 personas</div>
    <div id="roomStatus">Iniciando...</div>
</div>
<div id="map"></div>
<div class="control">
    <div class="leyenda"><span>🌡️ Intensidad calor</span><div class="gradient"></div><span>baja → alta</span></div>
    <button id="botonCentrar">📍 Mi ubicación</button>
</div>
<div class="debug" id="debugInfo">Esperando conexión...</div>
<div class="footer">🔥 Abre esta URL en varios dispositivos. Todos verán a todos.</div>

<script>
    const ROOM_ID = "fusagasuga2025";
    let peer, hubConnection, isHub = false, connectedPeers = [];
    let miUbicacion = null, miPeerId = null, heatLayer, map, miMarcador = null;
    let allLocations = [];
    let reconnectTimer = null;

    const iceServers = [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:3478', username: 'openrelayproject', credential: 'openrelayproject' }
    ];

    function debug(msg) {
        document.getElementById("debugInfo").innerText = msg;
        console.log(msg);
    }

    function initMap() {
        const centro = [4.3369, -74.3653];
        map = L.map('map').setView(centro, 14);
        
        // AQUÍ SE CAMBIÓ A LA CAPA OFICIAL DE OPENSTREETMAP
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        heatLayer = L.heatLayer([], { radius: 25, blur: 15, minOpacity: 0.3 });
        heatLayer.addTo(map);
        
        setInterval(actualizarHeatmap, 5000);
    }

    function actualizarHeatmap() {
        const ahora = Date.now();
        const MAX_EDAD = 30000;
        allLocations = allLocations.filter(p => (ahora - p.timestamp) < MAX_EDAD);
        
        heatLayer.setLatLngs(allLocations.map(p => [p.lat, p.lng, 1.0]));
        document.getElementById("contadorDispositivos").innerText = `👥 ${allLocations.length} persona${allLocations.length !== 1 ? 's' : ''}`;
        debug(`📍 ${allLocations.length} dispositivo(s) activo(s)`);
    }

    function actualizarMiUbicacion() {
        if (!miUbicacion || !miPeerId) return;
        allLocations = allLocations.filter(p => p.peerId !== miPeerId);
        allLocations.push({ lat: miUbicacion.lat, lng: miUbicacion.lng, peerId: miPeerId, timestamp: Date.now() });
        actualizarHeatmap();
    }

    function hubEnviarATodos(remitenteId, data) {
        connectedPeers.forEach(conn => {
            if (conn.peer !== remitenteId && conn.open) conn.send(data);
        });
    }

    function hubRecibirUbicacion(peerId, data) {
        if (data.type === "ubicacion") {
            const existing = allLocations.find(p => p.peerId === peerId);
            if (existing) {
                existing.lat = data.lat;
                existing.lng = data.lng;
                existing.timestamp = data.timestamp;
            } else {
                allLocations.push({ lat: data.lat, lng: data.lng, peerId: peerId, timestamp: data.timestamp });
            }
            actualizarHeatmap();
            hubEnviarATodos(peerId, data);
        }
    }

    function hubRemoverPeer(peerId) {
        allLocations = allLocations.filter(p => p.peerId !== peerId);
        actualizarHeatmap();
        connectedPeers = connectedPeers.filter(conn => conn.peer !== peerId);
        debug(`Cliente desconectado: ${peerId}`);
    }

    function configurarEventosHub() {
        isHub = true;
        document.getElementById("roomStatus").innerText = "🌟 Hub activo";
        debug(`Soy el HUB con ID: ${miPeerId}`);

        peer.on('connection', (conn) => {
            debug(`Nuevo cliente conectado: ${conn.peer}`);
            connectedPeers.push(conn);

            conn.on('data', (data) => hubRecibirUbicacion(conn.peer, data));
            conn.on('close', () => hubRemoverPeer(conn.peer));
            conn.on('error', (err) => debug(`Error con cliente ${conn.peer}: ${err}`));

            const otras = allLocations.filter(p => p.peerId !== conn.peer);
            otras.forEach(loc => conn.send({ type: "ubicacion", lat: loc.lat, lng: loc.lng, peerId: loc.peerId, timestamp: loc.timestamp }));
        });
    }

    function conectarAlHub() {
        if (!peer || peer.destroyed) return;
        document.getElementById("roomStatus").innerText = "🔗 Conectando al Hub...";
        
        const conn = peer.connect(ROOM_ID, { reliable: true });
        
        conn.on('open', () => {
            if (reconnectTimer) clearInterval(reconnectTimer);
            hubConnection = conn;
            document.getElementById("roomStatus").innerText = "📡 Conectado al Hub";
            debug("Conectado al Hub exitosamente");
            if (miUbicacion) enviarUbicacionAlHub();
        });

        conn.on('data', (data) => {
            if (data.type === "ubicacion" && data.peerId) {
                const existing = allLocations.find(p => p.peerId === data.peerId);
                if (existing) {
                    existing.lat = data.lat;
                    existing.lng = data.lng;
                    existing.timestamp = data.timestamp;
                } else {
                    allLocations.push({ lat: data.lat, lng: data.lng, peerId: data.peerId, timestamp: data.timestamp });
                }
                actualizarHeatmap();
            }
        });

        conn.on('close', () => {
            document.getElementById("roomStatus").innerText = "⚠️ Reconectando...";
            debug("Conexión perdida con el Hub. Intentando reconectar...");
            iniciarReconexion();
        });

        conn.on('error', (err) => {
            debug(`Error de conexión con el Hub: ${err}`);
        });
    }

    function iniciarReconexion() {
        if (reconnectTimer) return;
        reconnectTimer = setInterval(() => {
            if (!hubConnection || !hubConnection.open) {
                conectarAlHub();
            } else {
                clearInterval(reconnectTimer);
                reconnectTimer = null;
            }
        }, 3000);
    }

    function enviarUbicacionAlHub() {
        if (hubConnection && hubConnection.open && miUbicacion) {
            hubConnection.send({
                type: "ubicacion",
                lat: miUbicacion.lat,
                lng: miUbicacion.lng,
                peerId: miPeerId,
                timestamp: Date.now()
            });
        }
    }

    let watchId;
    function iniciarGeolocalizacion() {
        if (!navigator.geolocation) {
            alert("Geolocalización no soportada por tu navegador");
            return;
        }

        watchId = navigator.geolocation.watchPosition(
            (pos) => {
                miUbicacion = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                actualizarMiUbicacion();

                if (isHub) {
                    const data = { type: "ubicacion", lat: miUbicacion.lat, lng: miUbicacion.lng, peerId: miPeerId, timestamp: Date.now() };
                    hubEnviarATodos(miPeerId, data);
                } else {
                    enviarUbicacionAlHub();
                }

                if (!window.mapCentered) {
                    map.setView([miUbicacion.lat, miUbicacion.lng], 16);
                    window.mapCentered = true;
                }
            },
            (err) => debug("Error de ubicación: " + err.message),
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 3000 }
        );
    }

    function centrarMapa() {
        if (miUbicacion) {
            map.setView([miUbicacion.lat, miUbicacion.lng], 16);
            if (miMarcador) map.removeLayer(miMarcador);
            miMarcador = L.marker([miUbicacion.lat, miUbicacion.lng]).addTo(map).bindPopup("📱 Tú estás aquí").openPopup();
        } else {
            alert("Buscando tu ubicación GPS...");
        }
    }

    function iniciarSistema() {
        debug("Estableciendo conexión PeerJS...");
        peer = new Peer(ROOM_ID, { config: { iceServers: iceServers } });

        peer.on('open', (id) => {
            miPeerId = id;
            configurarEventosHub();
            iniciarGeolocalizacion();
        });

        peer.on('error', (err) => {
            if (err.type === 'unavailable-id') {
                debug("Hub detectado en la red. Conectando como Cliente...");
                peer.destroy();
                
                peer = new Peer({ config: { iceServers: iceServers } });
                peer.on('open', (id) => {
                    miPeerId = id;
                    isHub = false;
                    conectarAlHub();
                    iniciarGeolocalizacion();
                });
            } else {
                debug("Error P2P: " + err.type);
            }
        });
    }

    window.addEventListener("beforeunload", () => {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        if (peer) peer.destroy();
    });

    $(document).ready(() => {
        initMap();
        iniciarSistema();
        $("#botonCentrar").on("click", centrarMapa);
    });
</script>
</body>
</html>
