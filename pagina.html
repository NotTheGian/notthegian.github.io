<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Fusa·Heatmap colaborativo P2P</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #1a2a2a;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #0f2b2a;
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header h1 {
            font-size: 1.2rem;
            font-weight: 600;
        }
        .stats {
            background: #2c4e4b;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
        }
        #map {
            flex: 1;
            width: 100%;
            background: #cbd5e1;
        }
        .footer {
            background: #0f2b2a;
            color: #9bb5b0;
            padding: 6px 12px;
            font-size: 0.65rem;
            text-align: center;
        }
        .control {
            padding: 8px 12px;
            background: #f5f7fb;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #ddd;
        }
        button {
            background: #1e6f5c;
            border: none;
            padding: 6px 14px;
            border-radius: 40px;
            color: white;
            font-weight: 500;
            cursor: pointer;
        }
        button:active { transform: scale(0.96); }
        .leyenda {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
        }
        .gradient {
            width: 80px;
            height: 6px;
            background: linear-gradient(to right, blue, cyan, yellow, red);
            border-radius: 6px;
        }
        #roomStatus {
            font-size: 0.7rem;
            background: #2c4e4b;
            padding: 2px 8px;
            border-radius: 20px;
        }
    </style>
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
    <!-- PeerJS (WebRTC) -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- jQuery (opcional, para comodidad) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
<div class="header">
    <h1>📍 Fusa·Calor P2P</h1>
    <div class="stats" id="contadorDispositivos">0 personas</div>
    <div id="roomStatus">Conectando...</div>
</div>
<div id="map"></div>
<div class="control">
    <div class="leyenda">
        <span>🌡️ Intensidad calor</span>
        <div class="gradient"></div>
        <span>baja → alta</span>
    </div>
    <button id="botonCentrar">📍 Mi ubicación</button>
</div>
<div class="footer">
    🔥 Comparte esta URL en todos los teléfonos. El calor aumenta donde hay más personas juntas.
</div>

<script>
    // --------------------------------------------------------------
    // 1. CONFIGURACIÓN PEERJS (SALA COMPARTIDA)
    // --------------------------------------------------------------
    // ID de sala fijo para que todos los dispositivos se encuentren
    const ROOM_ID = "fusagasuga2025";
    let peer;
    let connections = [];       // lista de peers conectados
    let miUbicacion = null;
    let miPeerId = null;
    let heatLayer;
    let map;
    let allLocations = [];      // { lat, lng, peerId, timestamp }

    // --------------------------------------------------------------
    // 2. INICIALIZAR MAPA
    // --------------------------------------------------------------
    function initMap() {
        const centro = [4.3369, -74.3653];
        map = L.map('map').setView(centro, 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; CartoDB',
            subdomains: 'abcd'
        }).addTo(map);
        heatLayer = L.heatLayer([], { radius: 25, blur: 15, minOpacity: 0.3 });
        heatLayer.addTo(map);
    }

    // --------------------------------------------------------------
    // 3. ACTUALIZAR HEATMAP CON TODAS LAS UBICACIONES RECIBIDAS
    // --------------------------------------------------------------
    function actualizarHeatmap() {
        // Limpiar puntos viejos (más de 30 segundos sin actualizar)
        const ahora = Date.now();
        const MAX_EDAD = 30000; // 30 segundos
        const puntosValidos = allLocations.filter(p => (ahora - p.timestamp) < MAX_EDAD);
        if (puntosValidos.length !== allLocations.length) {
            allLocations = puntosValidos;
        }
        // Generar array para Leaflet.heat: [lat, lng, intensity]
        // Cada persona aporta intensidad 1 (se acumula)
        const points = puntosValidos.map(p => [p.lat, p.lng, 1.0]);
        heatLayer.setLatLngs(points);
        document.getElementById("contadorDispositivos").innerHTML = `👥 ${puntosValidos.length} persona${puntosValidos.length !== 1 ? 's' : ''}`;
    }

    // --------------------------------------------------------------
    // 4. ENVIAR MI UBICACIÓN A TODOS LOS PEERS CONECTADOS
    // --------------------------------------------------------------
    function broadcastUbicacion() {
        if (!miUbicacion || !peer) return;
        const data = {
            type: "ubicacion",
            lat: miUbicacion.lat,
            lng: miUbicacion.lng,
            peerId: miPeerId,
            timestamp: Date.now()
        };
        connections.forEach(conn => {
            if (conn.open) {
                conn.send(data);
            }
        });
        // También agregar mi propia ubicación al heatmap local
        // Eliminar mi entrada anterior si existe
        allLocations = allLocations.filter(p => p.peerId !== miPeerId);
        allLocations.push({
            lat: miUbicacion.lat,
            lng: miUbicacion.lng,
            peerId: miPeerId,
            timestamp: Date.now()
        });
        actualizarHeatmap();
    }

    // --------------------------------------------------------------
    // 5. RECIBIR UBICACIÓN DE OTRO PEER
    // --------------------------------------------------------------
    function recibirUbicacion(data) {
        if (data.type === "ubicacion" && data.peerId && data.lat && data.lng) {
            // Ignorar si es mi propio ID
            if (data.peerId === miPeerId) return;
            // Actualizar o agregar la ubicación
            const existing = allLocations.find(p => p.peerId === data.peerId);
            if (existing) {
                existing.lat = data.lat;
                existing.lng = data.lng;
                existing.timestamp = data.timestamp;
            } else {
                allLocations.push({
                    lat: data.lat,
                    lng: data.lng,
                    peerId: data.peerId,
                    timestamp: data.timestamp
                });
            }
            actualizarHeatmap();
        }
    }

    // --------------------------------------------------------------
    // 6. CONEXIÓN CON OTROS PEERS (WEBRTC)
    // --------------------------------------------------------------
    function conectarASala() {
        peer = new Peer(ROOM_ID + "_" + Math.random().toString(36).substr(2, 6), {
            debug: 2,
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        });

        peer.on('open', (id) => {
            miPeerId = id;
            document.getElementById("roomStatus").innerHTML = `📡 Sala: ${ROOM_ID}`;
            // Unirse a la sala principal: todos se conectan al mismo ID
            // Para que todos estén en un grupo, cada peer se conecta con el peer que tiene el ID fijo de la sala.
            // Vamos a crear un peer "coordinador" que es el ID fijo de la sala? No, mejor cada uno se conecta a los demás usando listas.
            // Método simplificado: cada peer se conecta a un "hub" con ID fijo (ROOM_ID). Ese hub será el primero en crearse.
            // Para evitar conflictos, el primer peer crea el ID fijo, los demás se conectan a él.
            // Pero si el primero se desconecta, los demás quedarán aislados.
            // Mejor usar un enfoque de "todos contra todos": cada vez que un nuevo peer se une, se conecta a todos los existentes.
            // Para eso necesitamos un servicio de descubrimiento, pero no tenemos.
            // La alternativa más simple: todos se conectan a un ID común (el mismo ROOM_ID). Ese ID actúa como sala.
            // PeerJS permite que múltiples peers se conecten al mismo ID (modo "room" no nativo, pero podemos simularlo).
            // Vamos a hacer que cada peer se conecte al ROOM_ID fijo, y el que lo cree será el "anfitrión".
        });

        peer.on('connection', (conn) => {
            // Cuando alguien se conecta a mí
            conectarConPeer(conn);
        });

        // Intentar conectarse al peer con ID = ROOM_ID
        function connectToRoom() {
            const conn = peer.connect(ROOM_ID);
            if (conn) {
                conectarConPeer(conn);
            } else {
                setTimeout(connectToRoom, 2000);
            }
        }

        // Registrar conexión
        function conectarConPeer(conn) {
            if (connections.some(c => c.peer === conn.peer)) return;
            connections.push(conn);
            conn.on('data', (data) => {
                recibirUbicacion(data);
            });
            conn.on('close', () => {
                connections = connections.filter(c => c.peer !== conn.peer);
                // Eliminar ubicaciones de ese peer
                allLocations = allLocations.filter(p => p.peerId !== conn.peer);
                actualizarHeatmap();
            });
            // Enviar mi ubicación actual a este nuevo peer
            if (miUbicacion) {
                conn.send({
                    type: "ubicacion",
                    lat: miUbicacion.lat,
                    lng: miUbicacion.lng,
                    peerId: miPeerId,
                    timestamp: Date.now()
                });
            }
        }

        // Esperar a que peer esté listo, luego conectarse al room
        peer.on('open', () => {
            setTimeout(() => {
                connectToRoom();
            }, 500);
        });
    }

    // --------------------------------------------------------------
    // 7. GEOLOCALIZACIÓN CONTINUA
    // --------------------------------------------------------------
    let watchId;
    function iniciarGeolocalizacion() {
        if (!navigator.geolocation) {
            alert("Tu navegador no soporta geolocalización.");
            return;
        }
        const options = {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 3000
        };
        watchId = navigator.geolocation.watchPosition(
            (pos) => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                miUbicacion = { lat, lng };
                broadcastUbicacion();
                // Centrar mapa la primera vez
                if (!window.mapCentered) {
                    map.setView([lat, lng], 16);
                    window.mapCentered = true;
                }
            },
            (err) => {
                console.error(err);
                alert("Error obteniendo ubicación. Asegura los permisos.");
            },
            options
        );
    }

    function centrarMapa() {
        if (miUbicacion) {
            map.setView([miUbicacion.lat, miUbicacion.lng], 16);
            L.marker([miUbicacion.lat, miUbicacion.lng]).addTo(map).bindPopup("📱 Tú aquí").openPopup();
        } else {
            alert("Aún no tenemos tu ubicación.");
        }
    }

    // --------------------------------------------------------------
    // 8. LIMPIEZA AL SALIR
    // --------------------------------------------------------------
    window.addEventListener("beforeunload", () => {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        if (peer) peer.destroy();
    });

    // --------------------------------------------------------------
    // 9. INICIALIZAR
    // --------------------------------------------------------------
    $(document).ready(() => {
        initMap();
        conectarASala();
        iniciarGeolocalizacion();
        $("#botonCentrar").on("click", centrarMapa);
    });
</script>
</body>
</html>
